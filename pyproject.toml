[project]
name = "kenggo"
version = "0.1.0"
description = "Research workspace for human-like Go agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "sgfmill==1.1.1",
    "torch==2.15.0",
]

[build-system]
requires = ["uv_build==0.11.16"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.16"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
